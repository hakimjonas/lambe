name: lambe
description: >-
  A query language for structured data that shows you what you're working with.
  Shape-aware --explain, JSON Schema input, format bridges. CLI + library + MCP.
version: 0.10.0
homepage: https://ardaproject.org/lambe
repository: https://github.com/hakimjonas/lambe
topics:
  - query
  - schema
  - json
  - yaml
  - jq

environment:
  sdk: ^3.7.0

dependencies:
  rumil: ^0.10.0
  rumil_parsers: ^0.10.0
  rumil_expressions: ^0.10.0
  rumil_tokens: ^0.10.0
  args: ^2.6.0
  dart_mcp: ^0.5.0

dev_dependencies:
  test: ^1.31.0
  lints: ^6.0.0

executables:
  lam: lam
  lam-mcp: mcp_server
