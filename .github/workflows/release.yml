name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lam-linux-x64
            mcp-artifact: lam-mcp-linux-x64
          - os: ubuntu-24.04-arm
            artifact: lam-linux-arm64
            mcp-artifact: lam-mcp-linux-arm64
          - os: macos-latest
            artifact: lam-macos-arm64
            mcp-artifact: lam-mcp-macos-arm64
          - os: macos-15-intel
            artifact: lam-macos-x64
            mcp-artifact: lam-mcp-macos-x64
          - os: windows-latest
            artifact: lam-windows-x64.exe
            mcp-artifact: lam-mcp-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: 3.12.1

      - run: dart pub get
      - run: dart run tool/gen_version.dart
      - run: dart compile exe bin/lam.dart -o ${{ matrix.artifact }}
      - run: dart compile exe bin/mcp_server.dart -o ${{ matrix.mcp-artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mcp-artifact }}
          path: ${{ matrix.mcp-artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build-provenance attestation needs an OIDC token to sign and
      # write permission to record the attestation for the repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          # One SHA256 per line, matching sha256sum / shasum -a 256 format.
          # install.sh reads this to verify downloaded binaries.
          sha256sum lam-* > checksums.txt
          cat checksums.txt

      # Free supply-chain provenance: attests that these exact binaries
      # were built by this workflow run from this commit. Verifiable with
      #   gh attestation verify lam-macos-arm64 --repo hakimjonas/lambe
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/lam-*"

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # Tags with a pre-release identifier (e.g. v0.13.0-rc.1) publish
          # as a GitHub pre-release, so install.sh's "latest" resolution
          # and `brew`/`scoop` keep pointing at the last stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-mcp:
    needs: release
    # Skip the registry/package-manager publishing jobs for pre-release
    # tags. They build + attest + create a (pre-)release so binaries are
    # available for staging, but don't touch the MCP registry or push to
    # the tap / Scoop bucket.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Update server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          HASH_LINUX_X64=$(sha256sum artifacts/lam-mcp-linux-x64 | cut -d' ' -f1)
          HASH_LINUX_ARM64=$(sha256sum artifacts/lam-mcp-linux-arm64 | cut -d' ' -f1)
          HASH_MACOS_X64=$(sha256sum artifacts/lam-mcp-macos-x64 | cut -d' ' -f1)
          HASH_MACOS_ARM64=$(sha256sum artifacts/lam-mcp-macos-arm64 | cut -d' ' -f1)
          HASH_WINDOWS=$(sha256sum artifacts/lam-mcp-windows-x64.exe | cut -d' ' -f1)
          TAG=${GITHUB_REF#refs/tags/}
          cat > server.json <<EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.hakimjonas/lambe",
            "title": "Lambë",
            "description": "Shape-aware query language for structured data — JSON, YAML, TOML, HCL, CSV, Markdown.",
            "repository": {
              "url": "https://github.com/hakimjonas/lambe.git",
              "source": "github"
            },
            "version": "${VERSION}",
            "packages": [
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/hakimjonas/lambe/releases/download/${TAG}/lam-mcp-linux-x64",
                "fileSha256": "${HASH_LINUX_X64}",
                "transport": { "type": "stdio" }
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/hakimjonas/lambe/releases/download/${TAG}/lam-mcp-linux-arm64",
                "fileSha256": "${HASH_LINUX_ARM64}",
                "transport": { "type": "stdio" }
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/hakimjonas/lambe/releases/download/${TAG}/lam-mcp-macos-x64",
                "fileSha256": "${HASH_MACOS_X64}",
                "transport": { "type": "stdio" }
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/hakimjonas/lambe/releases/download/${TAG}/lam-mcp-macos-arm64",
                "fileSha256": "${HASH_MACOS_ARM64}",
                "transport": { "type": "stdio" }
              },
              {
                "registryType": "mcpb",
                "identifier": "https://github.com/hakimjonas/lambe/releases/download/${TAG}/lam-mcp-windows-x64.exe",
                "fileSha256": "${HASH_WINDOWS}",
                "transport": { "type": "stdio" }
              }
            ]
          }
          EOF

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # Publish the package to pub.dev via OIDC trusted publishing (no stored
  # credentials — the same id-token mechanism publish-mcp uses). Requires
  # the automated publisher to be configured once on pub.dev:
  #   pub.dev → lambe → Admin → Automated publishing → Enable, repo
  #   hakimjonas/lambe, tag pattern v{{version}}.
  # Until that's enabled this job will fail at the publish step; the rest
  # of the release is unaffected (it needs `release` only for ordering).
  #
  # Before this job existed pub.dev was published BY HAND, and 0.13.0
  # shipped everywhere else while pub.dev stayed at 0.12.0 until caught.
  publish-pub-dev:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: 3.12.1

      - run: dart pub get
      # _version.dart is generated (gitignored), so regenerate it before
      # publishing or the published package ships a stale version constant.
      - run: dart run tool/gen_version.dart
      - run: dart run tool/gen_skill.dart

      - name: Publish to pub.dev
        run: dart pub publish --force

  # Regenerate the Homebrew formula from the released binaries and push
  # it to the tap repo. Requires a HOMEBREW_TAP_TOKEN secret: a
  # fine-grained PAT with contents:write on hakimjonas/homebrew-lambe.
  update-homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew formula update. Add the secret to enable it."
            exit 0
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          SHA_MAC_ARM=$(sha256sum artifacts/lam-macos-arm64 | cut -d' ' -f1)
          SHA_MAC_X64=$(sha256sum artifacts/lam-macos-x64 | cut -d' ' -f1)
          SHA_LNX_ARM=$(sha256sum artifacts/lam-linux-arm64 | cut -d' ' -f1)
          SHA_LNX_X64=$(sha256sum artifacts/lam-linux-x64 | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hakimjonas/homebrew-lambe.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/lambe.rb <<EOF
          # Generated by the lambe release workflow (.github/workflows/release.yml).
          # Do not edit by hand: changes are overwritten on the next release.
          class Lambe < Formula
            desc "Shape-aware query language for JSON, YAML, TOML, HCL, CSV, and Markdown"
            homepage "https://ardaproject.org/lambe"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/lam-macos-arm64"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "${BASE}/lam-macos-x64"
                sha256 "${SHA_MAC_X64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/lam-linux-arm64"
                sha256 "${SHA_LNX_ARM}"
              end
              on_intel do
                url "${BASE}/lam-linux-x64"
                sha256 "${SHA_LNX_X64}"
              end
            end

            def install
              bin.install Dir["*"].first => "lam"
            end

            test do
              assert_equal "2", shell_output("#{bin}/lam -n '1 + 1'").strip
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lambe.rb
          git diff --staged --quiet || git commit -m "lambe ${VERSION}"
          git push

  # Bump the Scoop manifest in this repo (it doubles as a Scoop bucket).
  # `main` is branch-protected (5 required status checks, enforce_admins),
  # so a direct push is rejected — GitHub returns GH006 because the pushed
  # commit has no check runs and nothing can bypass. Instead, open a PR
  # from a release branch; its own CI satisfies the required checks and it
  # merges like any other change.
  #
  # The PR is created with SCOOP_PR_TOKEN (a fine-grained PAT with
  # contents:write + pull-requests:write on this repo), NOT the built-in
  # GITHUB_TOKEN: PRs opened by GITHUB_TOKEN do not trigger workflows
  # (anti-recursion), so their required checks would never run and the PR
  # would be unmergeable. If the secret is unset the job skips gracefully
  # (warning + exit 0) so a release never fails on the Scoop bump; bump
  # bucket/lambe.json by hand in that case.
  update-scoop:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Bump Scoop manifest and open PR
        env:
          GH_TOKEN: ${{ secrets.SCOOP_PR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::SCOOP_PR_TOKEN is not set; skipping Scoop manifest PR. Bump bucket/lambe.json by hand, or add the secret to enable it."
            exit 0
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          HASH=$(sha256sum artifacts/lam-windows-x64.exe | cut -d' ' -f1)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          cat > bucket/lambe.json <<EOF
          {
            "version": "${VERSION}",
            "description": "Shape-aware query language for structured data — JSON, YAML, TOML, HCL, CSV, Markdown.",
            "homepage": "https://ardaproject.org/lambe",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${BASE}/${TAG}/lam-windows-x64.exe#/lam.exe",
                "hash": "${HASH}"
              }
            },
            "bin": "lam.exe",
            "checkver": {
              "github": "https://github.com/${GITHUB_REPOSITORY}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "${BASE}/v\$version/lam-windows-x64.exe#/lam.exe",
                  "hash": {
                    "url": "${BASE}/v\$version/checksums.txt",
                    "regex": "\$sha256\\\\s+lam-windows-x64.exe"
                  }
                }
              }
            }
          }
          EOF

          if git diff --quiet -- bucket/lambe.json; then
            echo "Scoop manifest already up to date."
            exit 0
          fi

          BRANCH="scoop/lambe-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add bucket/lambe.json
          git commit -m "scoop: lambe ${VERSION}"
          git push -u origin "${BRANCH}" --force-with-lease
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "scoop: lambe ${VERSION}" \
            --body "Automated Scoop manifest bump for v${VERSION}, opened by the release workflow. Merges once CI passes."
